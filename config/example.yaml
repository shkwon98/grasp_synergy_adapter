# Grasp synergy adapter example.
#
# Each grasp becomes a normalized one-joint JTC-compatible interface. The adapter
# expands its commands and forwards them to one physical JointTrajectoryController.
# For "pinch", clients use:
#   <node_namespace>/pinch_controller/joint_trajectory
#   <node_namespace>/pinch_controller/follow_joint_trajectory
# Remap these downstream interfaces at launch:
#   target/joint_trajectory
#   target/follow_joint_trajectory
#   target/controller_state
/**/grasp_synergy_adapter:
  ros__parameters:
    # ── Hand interface ───────────────────────────────────────────────
    #   synergy_joint     [string, required]        Joint name accepted from clients.
    #   joints            [list[string], required]  Physical-controller joint order.
    #   state_timeout_sec [double, s, > 0]          Maximum controller-state age.
    #
    # • Joint names must be nonempty and unique. Every positions list below must
    #   match joints order and length.
    # • Commands are rejected until a complete, fresh controller state is available.
    synergy_joint: synergy
    joints: [finger_a_joint, finger_b_joint]
    state_timeout_sec: 0.5

    # ── Grasp profiles ───────────────────────────────────────────────
    # Each name creates one <grasp>_controller topic and action endpoint.
    # To add a grasp, append its name here and copy the nested pinch block below.
    grasp_names: [pinch]

    # Each entry below grasps has:
    #   knot_names  Ordered knot names.
    #   knots       Named knot definitions, each containing:
    #     coordinate  [double, normalized]
    #     positions   [list[double], joint position]
    #
    #   • Provide at least two knots in knot_names order.
    #   • Coordinates must be finite and strictly increase from 0.0 to 1.0.
    #   • Positions must be finite. Use rad for revolute and m for prismatic joints.
    #   • Adjacent knots must not have identical positions.
    #
    # Positions are linearly interpolated between knots. Crossed intermediate knots
    # are included in the output, starting from the current projected hand state.
    grasps:
      pinch:
        knot_names: [pre_grasp, intermediate, grasp]
        knots:
          pre_grasp:
            coordinate: 0.0
            positions: [0.0, 0.0]
          intermediate:
            coordinate: 0.5
            positions: [0.8, 0.4]
          grasp:
            coordinate: 1.0
            positions: [1.0, 1.0]
