name: ROS 2 CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build_and_test:
    name: Build and test (${{ matrix.ros.distro }}, ${{ matrix.platform.architecture }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        ros:
          - distro: humble
            ubuntu: jammy
          - distro: jazzy
            ubuntu: noble
          - distro: kilted
            ubuntu: noble
          - distro: lyrical
            ubuntu: resolute
          - distro: rolling
            ubuntu: resolute
        platform:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    container:
      image: rostooling/setup-ros-docker:ubuntu-${{ matrix.ros.ubuntu }}-latest
    steps:
      - name: Build and test
        uses: ros-tooling/action-ros-ci@v0.4
        with:
          package-name: grasp_synergy_adapter
          target-ros2-distro: ${{ matrix.ros.distro }}
          no-symlink-install: true
          coverage-result: false

  documentation:
    name: Build documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: rostooling/setup-ros-docker:ubuntu-noble-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install rosdoc2
        run: |
          apt-get update
          apt-get install -y python3-rosdoc2
      - name: Build documentation
        run: rosdoc2 build --package-path .
